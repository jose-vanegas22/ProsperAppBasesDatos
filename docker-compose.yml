version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: prosperapp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prosperapp_user
      POSTGRES_PASSWORD: prosperapp_pass
      POSTGRES_DB: prosperapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
